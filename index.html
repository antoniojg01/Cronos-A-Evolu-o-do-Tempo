
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRONOS | Arquivo Universal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #a855f7;
            --neon-cyan: #22d3ee;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        #root {
            height: 100%;
            width: 100%;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        .glass {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #020617;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { 
            background: #1e293b; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
    <script>
        // Inicialização de ambiente segura
        window.process = { 
            env: { 
                API_KEY: "" // Será injetado pelo ambiente se disponível
            } 
        };
        
        // Captura de erros catastróficos para debug
        window.onerror = function(msg, url, line, col, error) {
            console.error("Erro Global CRONOS:", msg, "em", url, ":", line);
            return false;
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen" id="app-loader">
            <div class="w-16 h-16 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
            <p class="font-space text-indigo-400 text-xs tracking-[0.4em] uppercase animate-pulse">Sincronizando Arquivo Universal...</p>
        </div>
    </div>
    <script type="module">
        import "./index.tsx";
        // Remove o loader assim que o script principal carregar (opcional, o React cuidará do conteúdo)
        setTimeout(() => {
            const loader = document.getElementById('app-loader');
            if (loader) loader.style.opacity = '0';
            setTimeout(() => loader?.remove(), 500);
        }, 2000);
    </script>
</body>
</html>
