
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRONOS | Arquivo Universal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; width: 100vw; margin: 0; padding: 0;
            overflow: hidden; background-color: #020617;
            color: #f8fafc; font-family: 'Inter', sans-serif;
        }
        #root { height: 100%; width: 100%; overflow: hidden; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        /* Ajustes Mobile específicos */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .px-safe { 
            padding-left: env(safe-area-inset-left); 
            padding-right: env(safe-area-inset-right); 
        }

        ::-webkit-scrollbar { width: 0; background: transparent; }
        
        .custom-scrollbar {
            -webkit-overflow-scrolling: touch;
        }

        .loading-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #020617; z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
    </style>
    <script>
        window.process = { env: { API_KEY: "" } };
        window.hideAppLoader = function() {
            const loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.pointerEvents = 'none';
                setTimeout(() => {
                    if (loader.parentNode) {
                        loader.parentNode.removeChild(loader);
                    }
                }, 500);
            }
        };
        
        // Fallback: remove o loader após 5 segundos caso o React não carregue
        setTimeout(function() {
            const loader = document.getElementById('app-loader');
            if (loader && loader.style.opacity !== '0') {
                window.hideAppLoader();
            }
        }, 5000);
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div class="loading-screen" id="app-loader">
        <div class="w-12 h-12 border-2 border-indigo-500/10 border-t-indigo-500 rounded-full animate-spin mb-6"></div>
        <p class="font-space text-indigo-400 text-[8px] tracking-[0.8em] uppercase animate-pulse">Sincronizando Órbita...</p>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
